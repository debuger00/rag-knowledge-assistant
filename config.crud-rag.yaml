documents:
  path: ./data/crud_rag_demo/vault
  ignore_dirs: []

llm:
  model: deepseek-chat
  base_url: https://api.deepseek.com

embedding:
  model: BAAI/bge-small-zh-v1.5
  device: cuda
  local_files_only: false

storage:
  chroma_dir: ./data/crud_rag_demo/chroma
  history_dir: ./data/crud_rag_demo/history

retrieval:
  top_k: 10
  score_threshold: 0.0
  max_citations: 10
  max_retry: 1
  require_citations: true
  enable_link_expansion: false

server:
  host: 127.0.0.1
  port: 8501

chunking:
  chunk_size: 800
  chunk_overlap: 100
  max_len_before_split: 2000

graph:
  enabled: true
  db_path: ./data/crud_rag_demo/graph.sqlite3
  max_hops: 2
  max_seed_nodes: 10
  max_neighbors: 30
  graph_weight: 0.25
  entity_extraction: true
  community_detection: true
  community_reports: true
  extraction:
    prompt: prompts/extract_graph.txt
    summary_prompt: prompts/summarize_descriptions.txt
    entity_types:
      - person
      - organization
      - location
      - event
      - policy
      - product
    max_gleanings: 0
    concurrency: 4
    max_retries: 2
    min_confidence: 0.65
  community:
    max_cluster_size: 100
    seed: 42
    report_prompt: prompts/community_report.txt
