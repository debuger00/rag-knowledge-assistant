<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/alpine.min.js"></script>
    <script src="/static/marked.min.js"></script>
</head>
<body x-data="chatApp()" x-init="init()">
    <header class="header">
        <h1>📚 我的知识库助手</h1>
        <div>
            <span class="status-bar" x-text="statusText">连接中...</span>
            <button @click="showSettings = !showSettings" style="background:none;border:none;cursor:pointer;font-size:18px;margin-left:12px;">⚙️</button>
        </div>
    </header>

    <div class="chat-container" x-ref="chatContainer" id="chatContainer">
        <template x-if="messages.length === 0">
            <div class="message assistant">
                🤖 你好，我是你的知识库助手。<br>可以问我关于你笔记中的任何问题。
            </div>
        </template>

        <template x-for="msg in messages" :key="msg.id">
            <div class="message" :class="msg.role"
                 x-show="msg.role === 'user' || msg.response !== null || !!msg.error">
                <div x-show="msg.role === 'user'" x-text="msg.content"></div>
                <div x-show="msg.response?.status === 'answered'" class="answer-card">
                    <h2>回答</h2>
                    <template x-for="(item, itemIndex) in (msg.response?.answer || [])" :key="itemIndex">
                        <p class="answer-sentence"><span x-text="item.text"></span><template x-for="citationId in item.citation_ids" :key="citationId"><button class="citation-marker" @click="jumpToCitation(msg, citationId)" x-text="'[' + citationNumber(msg, citationId) + ']'" :aria-label="'跳转到引用 ' + citationNumber(msg, citationId)"></button></template></p>
                    </template>
                    <section class="citation-section">
                        <h3>引用依据</h3>
                        <template x-for="citation in (msg.response?.citations || [])" :key="citation.id">
                            <article class="citation-card" :id="citationDomId(msg, citation.id)" :class="{ highlighted: highlightedCitation === citationDomId(msg, citation.id) }" @click="viewSource(citation)">
                                <div class="citation-card-header"><span class="citation-index" x-text="'[' + citationNumber(msg, citation.id) + ']'">[1]</span><strong x-text="fileName(citation.document_path)"></strong><span class="citation-section-title" x-text="'› ' + citation.section_title"></span></div>
                                <div class="citation-meta" x-text="citation.document_path"></div>
                                <div class="citation-meta" x-text="'anchor: ' + citation.anchor"></div>
                                <blockquote class="citation-quote" :class="{ expanded: expandedQuotes[citationDomId(msg, citation.id)] }" x-text="citation.quote"></blockquote>
                                <div class="citation-actions"><button @click.stop="toggleQuote(msg, citation)" x-text="expandedQuotes[citationDomId(msg, citation.id)] ? '收起' : '展开原文'"></button><button @click.stop="viewSource(citation)">查看原文</button><span x-show="citation.score !== undefined" x-text="'相关度 ' + Number(citation.score).toFixed(2)"></span></div>
                            </article>
                        </template>
                    </section>
                </div>
                <div x-show="msg.response?.status === 'insufficient_evidence'" class="refusal-card"><h2>未找到可靠答案</h2><p x-text="msg.response?.message"></p><p class="refusal-reason"><strong>原因：</strong><span x-text="msg.response?.reason"></span></p></div>
                <div x-show="msg.error" class="error-message" x-text="msg.error"></div>
            </div>
        </template>

        <div class="typing-indicator" x-show="loading" x-text="typingText">...</div>
    </div>

    <div class="input-area">
        <select x-model="retrievalMode" @change="localStorage.setItem('retrievalMode', retrievalMode)" aria-label="检索模式" title="检索模式">
            <option value="auto">自动检索</option>
            <option value="local">图增强</option>
            <option value="basic">仅向量</option>
        </select>
        <input
            type="text"
            x-model="question"
            placeholder="输入你的问题..."
            @keydown.enter="sendMessage"
            :disabled="loading"
        />
        <button @click="sendMessage" :disabled="loading || !question.trim()">发送</button>
    </div>

    <template x-if="showSettings">
        <div>
            <div class="overlay" @click="showSettings = false"></div>
            <div class="settings-panel">
                <h2>⚙️ 设置</h2>
                <label>文档目录 <span style="color:var(--muted);font-size:12px;">（服务端 config.yaml 配置）</span></label>
                <input type="text" x-model="settings.vaultPath" disabled
                       x-bind:value="serverConfig?.vault_path || ''"
                       placeholder="E:/你的Obsidian仓库路径">
                <label>检索数量 (top-k)</label>
                <input type="number" x-model="settings.topK" min="1" max="50">

                <hr style="margin:12px 0;border-color:var(--border);">
                <div style="font-size:12px;color:var(--muted);line-height:1.8;">
                    <div>嵌入模型：<span x-text="serverConfig?.embedding_model || '-'"></span></div>
                    <div>推理设备：<span x-text="serverConfig?.embedding_device || '-'"></span></div>
                    <div>LLM 模型：<span x-text="serverConfig?.llm_model || '-'"></span></div>
                </div>

                <button @click="saveSettings()">保存设置</button>
                <button @click="rebuildIndex()" style="background:var(--danger);margin-top:8px;">🔄 重建索引</button>
            </div>
        </div>
    </template>

    <template x-if="preview.open">
        <div><div class="overlay" @click="closePreview()"></div><aside class="source-preview" role="dialog" aria-modal="true"><button class="preview-close" @click="closePreview()">×</button><h2 x-text="preview.title"></h2><div class="citation-meta" x-text="preview.location"></div><pre class="preview-content"><template x-for="(part, index) in preview.parts" :key="index"><mark x-show="part.highlight" x-text="part.text"></mark><span x-show="!part.highlight" x-text="part.text"></span></template></pre></aside></div>
    </template>

    <script>
    function chatApp() {
        return {
            messages: [],
            question: '',
            retrievalMode: localStorage.getItem('retrievalMode') || 'auto',
            loading: false,
            typingText: '',
            showSettings: false,
            sessionId: 'web_' + Date.now(),
            serverConfig: null,
            highlightedCitation: '',
            expandedQuotes: {},
            preview: { open: false, title: '', location: '', parts: [] },
            settings: {
                vaultPath: localStorage.getItem('vaultPath') || '',
                topK: parseInt(localStorage.getItem('topK') || '10'),
            },
            statusText: '连接中...',

            async init() {
                await this.fetchStatus();
                setInterval(() => this.fetchStatus(), 60000);
            },

            async fetchStatus() {
                let connected = false;
                for (let i = 0; i < 3; i++) {
                    try {
                        const res = await fetch('/api/status');
                        const data = await res.json();
                        if (data.status === 'ok' && data.index) {
                            const t = new Date(data.index.last_sync).toLocaleTimeString('zh-CN');
                            const graphText = data.graph ? ` · 图 ${data.graph.node_count} 节点` : '';
                            this.statusText = `已索引 ${data.index.parent_count} 篇笔记${graphText} · 最近同步 ${t}`;
                        }
                        if (data.config) {
                            if (!localStorage.getItem('vaultPath')) {
                                this.settings.vaultPath = data.config.vault_path || '';
                            }
                            if (!localStorage.getItem('topK')) {
                                this.settings.topK = data.config.retrieval_top_k || 10;
                            }
                            this.serverConfig = data.config;
                        }
                        connected = true;
                        break;
                    } catch (e) {
                        if (i < 2) {
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    }
                }
                if (!connected) {
                    this.statusText = '服务未连接';
                }
            },

            async sendMessage() {
                const q = this.question.trim();
                if (!q || this.loading) return;

                const userMsg = { id: Date.now(), role: 'user', content: q };
                this.messages.push(userMsg);
                this.question = '';
                this.loading = true;
                this.typingText = '🔍 正在检索笔记...';
                this.scrollToBottom();

                const assistantIndex = this.messages.length;
                this.messages.push({
                    id: Date.now() + 1,
                    role: 'assistant',
                    response: null,
                    error: '',
                });

                try {
                    const resp = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: q,
                            session_id: this.sessionId,
                            mode: this.retrievalMode,
                        }),
                    });

                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.detail || '请求失败');
                    // 必须通过 Alpine 代理后的数组元素更新，保证 UI 被通知。
                    this.messages[assistantIndex].response = data;
                } catch (e) {
                    this.messages[assistantIndex].error = '⚠️ 请求失败：' + e.message;
                }
                this.loading = false;
                this.typingText = '';
                this.scrollToBottom();
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const c = this.$refs.chatContainer;
                    if (c) c.scrollTop = c.scrollHeight;
                });
            },

            citationNumber(msg, citationId) {
                return (msg.response?.citations || []).findIndex(c => c.id === citationId) + 1;
            },

            citationDomId(msg, citationId) { return `citation-${msg.id}-${citationId}`; },

            fileName(path) { return (path || '').split(/[\\/]/).pop(); },

            jumpToCitation(msg, citationId) {
                const id = this.citationDomId(msg, citationId);
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                this.highlightedCitation = id;
                setTimeout(() => { if (this.highlightedCitation === id) this.highlightedCitation = ''; }, 1800);
            },

            toggleQuote(msg, citation) {
                const id = this.citationDomId(msg, citation.id);
                this.expandedQuotes[id] = !this.expandedQuotes[id];
            },

            async viewSource(citation) {
                try {
                    const url = '/api/sources/' + encodeURIComponent(citation.document_path)
                        + '?anchor=' + encodeURIComponent(citation.anchor);
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.detail || '来源不存在');
                    const quote = citation.quote || '';
                    const start = data.content.indexOf(quote);
                    this.preview = {
                        open: true,
                        title: this.fileName(citation.document_path) + ' › ' + citation.section_title,
                        location: citation.document_path + '#' + citation.anchor,
                        parts: start >= 0 ? [
                            { text: data.content.slice(0, start), highlight: false },
                            { text: quote, highlight: true },
                            { text: data.content.slice(start + quote.length), highlight: false },
                        ] : [{ text: data.content, highlight: false }],
                    };
                } catch (e) {
                    alert('无法加载来源：' + e.message);
                }
            },

            closePreview() { this.preview.open = false; },

            async saveSettings() {
                localStorage.setItem('topK', this.settings.topK);
                this.showSettings = false;
                alert('设置已保存；服务端参数请修改 config.yaml 后重启');
            },

            async rebuildIndex() {
                if (!confirm('确定要重建整个索引吗？这可能需要几分钟。')) return;
                try {
                    const resp = await fetch('/api/reindex', { method: 'POST' });
                    const data = await resp.json();
                    alert(`索引重建完成：${data.total_parents} 篇父文档，${data.total_children} 个子块`);
                    await this.fetchStatus();
                } catch (e) {
                    alert('重建失败：' + e.message);
                }
            },
        };
    }
    </script>
</body>
</html>
