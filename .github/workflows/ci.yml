name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest tests -q
        env:
          EMBEDDING_DEVICE: cpu
          EMBEDDING_LOCAL_FILES_ONLY: "false"
